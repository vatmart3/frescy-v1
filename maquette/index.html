    if (!name) { $('#a-name').focus(); return; }
    if (off == null) { $('#a-date').focus(); $('#a-prev').innerHTML = '<span style="color:var(--red)">Indiquez une date : +2, 25/10 ou « demain »</span>'; return; }
    S.products.push({ id: 'n' + (++seq), name, pack: '', cat: 'Divers', d: off, qty, price: 2.5, ean: null, dt: 'DLC', isNew: true });
    S.added++;
    S.addDraft = { name: '', date: $('#a-date').value, qty: '1' };
    S.dq = ''; S.dcat = '';
    deskRender();
    $('#a-name').focus();
    deskToast(`Ajouté : ${name} ×${qty} · ${fmtShort(addDays(off)).toLowerCase()}`);
  }

  /* Panneau latéral : fiche produit */
  function panelHtml() {
    const p = S.panelId && find(S.panelId);
    if (!p) return '';
    const promo = featureIsPromo(p);
    const tone = dueTone(p);
    return `
      <div class="bar"><span class="bar-title">Fiche produit</span><button class="icon-btn" data-act="dclose" aria-label="Fermer la fiche">${ic('x')}</button></div>
      <div class="dpanel-body">
        <div><div class="pcell" style="margin-bottom:12px">${isq(p)}<div class="opt-s" style="margin:0">${rayonOf(p)} · ${esc(p.cat)}${p.pack ? ' · ' + esc(p.pack) : ''}</div></div><h2 class="p-name">${esc(p.name)}</h2>
          <div class="p-meta"><span class="status ${tone}"><span class="dot ${tone}"></span>${statusTextP(p)}</span>${dtypeSeg(dtOf(p), 'set-dt')}</div></div>
        <div class="dgrid2">
          <label class="dfield"><span>${DT_LABEL[dtOf(p)]}</span><input class="input" type="date" id="dp-date" value="${iso(addDays(p.d))}"></label>
          <div class="dfield"><span>Quantité</span><div class="stepper"><button data-act="dpqty" data-v="-1" aria-label="Retirer un">${ic('minus', 'ico-sm')}</button><span class="v">${p.qty}</span><button data-act="dpqty" data-v="1" aria-label="Ajouter un">${ic('plus', 'ico-sm')}</button></div></div>
        </div>
        ${recoCard(p, 'desk')}
        <div class="kv">
          <div><span class="k">Prix unitaire</span><b class="num">${p.promo ? `<span class="price-old">${eur(p.price)}</span>` : ''}${eur(unitPrice(p))}</b></div>
          <div><span class="k">Valeur en rayon</span><b class="num">${eur(p.qty * unitPrice(p))}</b></div>
          <div><span class="k">Code EAN</span><span class="num">${p.ean || 'Sans code-barres'}</span></div>
        </div>
      </div>
      <div class="p-actions">
        <button class="a-sold" data-act="ddo" data-k="sold" data-id="${p.id}">${ic('check')}Vendu</button>
        <button class="a-feat ${promo ? 'promo' : ''}" data-act="ddo" data-k="feature" data-id="${p.id}">${ic(promo ? 'tag' : 'up')}Mis en avant</button>
        <button class="a-donate" data-act="ddo" data-k="donate" data-id="${p.id}">${ic('heart')}Donné</button>
        <button class="a-trash" data-act="ddo" data-k="trash" data-id="${p.id}">${ic('trash')}Jeté</button>
      </div>`;
  }

  /* 3. Économies */
  function savingsPage() {
    const s = savings();
    return `
      <div class="dhead"><div><h1>Économies</h1><div class="sub">4 dernières semaines</div></div>
        <button class="btn btn-ghost" data-act="dexport" style="min-height:48px">${ic('download')}Exporter en PDF</button></div>
      <div>
        <div class="big green" style="font-size:72px">${eur0(s.monthEur)}</div>
        <div class="big-l">sauvés ce mois-ci</div>
        <div class="big-s">Soit ${times(s.monthEur / SUB_PRICE)}× le prix de l'abonnement · ${s.monthN} produits sauvés.</div>
      </div>
      <div class="card" style="padding:28px">
        <div class="card-h"><span class="card-t">Par semaine</span><span class="card-s">en euros</span></div>
        ${chartSvg(s.month, monthLabels(), { w: 600, h: 260, f: 15, bar: 80, label: 'Euros récupérés par semaine', fmt: v => eur0(v) })}
      </div>`;
  }
  function exportModal() {
    const s = savings(), m = s.m;
    const row = (l, k) => `<tr><td>${l}</td><td>${m[k][0]}</td><td>${eur(m[k][1])}</td></tr>`;
    const labels = monthLabels();
    openModal(`
      <h2>Récapitulatif mensuel</h2>
      <p>Aperçu du PDF à transmettre à votre comptable.</p>
      <div class="paper">
        <div class="paper-h"><div><h3>Frescy · récapitulatif ${monthName()} ${TODAY.getFullYear()}</h3><div class="muted" style="margin-top:4px">${esc(S.shop.name)} · Sète</div></div><div class="muted" style="text-align:right">4 semaines<br>au ${TODAY.toLocaleDateString('fr-FR')}</div></div>
        <div class="ptot"><div>Récupérés<b>${eur(s.monthEur)}</b></div><div>Produits sauvés<b>${s.monthN}</b></div><div>Pertes<b>${eur(m.trash[1])}</b></div></div>
        <h4>Répartition</h4>
        <table><thead><tr><th>Type</th><th>Produits</th><th>Montant</th></tr></thead><tbody>
          ${row('Vendus au prix normal', 'normal')}${row('Vendus en promo', 'promo')}${row('Mis en avant puis vendus', 'front')}<tr><td>Donnés à une association</td><td>${m.donated[0]}</td><td>valeur ${eur(m.donated[1])}</td></tr>${row('Jetés (perte)', 'trash')}
        </tbody></table>
        <h4>Par semaine</h4>
        <table><thead><tr><th>Semaine</th><th>Récupérés</th></tr></thead><tbody>
          ${s.month.map((v, i) => `<tr><td>${labels[i]}</td><td>${eur(v)}</td></tr>`).join('')}
        </tbody></table>
        <div class="pfoot">Document généré par Frescy le ${TODAY.toLocaleDateString('fr-FR')}. Montants TTC encaissés en caisse.</div>
      </div>
      <div class="dmodal-actions">
        <button class="btn btn-ghost" data-act="dmodal-close">Fermer</button>
        <button class="btn btn-primary" data-act="dpdf">${ic('download')}Télécharger le PDF</button>
      </div>`, true);
  }

  /* 4. Réglages */
  function settingsPage() {
    return `
      <div class="dhead"><div><h1>Réglages</h1></div></div>
      <div class="dset">${settingsBlocks()}
        <div style="margin-top:32px"><button class="btn btn-ghost" data-act="logout" style="min-height:48px">Se déconnecter</button></div>
      </div>`;
  }

  /* Modale & toast (ordinateur) */
  function openModal(html, wide) { const m = $('#dmodal'); m.innerHTML = html; m.classList.toggle('wide', !!wide); $('#dmodal-back').classList.add('on'); }
  function closeModal() { const b = $('#dmodal-back'); if (b) b.classList.remove('on'); }
  let dToastT = 0;
  function deskToast(msg, undo) {
    const t = $('#dtoast'); if (!t) return;
    t.innerHTML = `${undo !== false ? tcheck() : ''}<span class="msg">${esc(msg)}</span>${undo ? '<button data-act="undo">Annuler</button>' : ''}`;
    t.classList.add('on');
    clearTimeout(dToastT);
    dToastT = setTimeout(() => t.classList.remove('on'), undo ? 4500 : 2600);
  }
  function deskAct(id, kind) {
    const res = applyAction(id, kind);
    if (!res) return;
    if (!res.undo) { deskToast(res.msg, false); return; }
    if (kind !== 'feature' && S.panelId === id) S.panelId = null;
    deskRender();
    deskToast(res.msg, res.undo);
  }

  /* ======================= ÉVÉNEMENTS ======================= */
  document.addEventListener('click', e => {
    // Ouvre le calendrier natif quand il existe (champ date invisible)
    const dp = e.target.closest('.tile-date, label.chip');
    if (dp) { const i = dp.querySelector('input[type="date"]'); try { i && i.showPicker && i.showPicker(); } catch (err) {} }
    const b = e.target.closest('[data-act], [data-go], [data-open]');
    if (!b) return;
    if (b.dataset.go) { protoGo(b.dataset.go); return; }
    if (b.dataset.open && !b.dataset.act) { S.panelId = S.panelId === b.dataset.open ? null : b.dataset.open; deskRender(); return; }
    const v = b.dataset.v;
    switch (b.dataset.act) {
      case 'view': S.view = v; applyView(); break;
      case 'auth': S.auth = v; S.step = 1; route(); break;
      case 'step-back': { const f = $('form[data-form]'); if (f) readAuthForm(f); S.step = 1; route(); break; }
      case 'stype': { const f = $('form[data-form]'); if (f) readAuthForm(f); S.draft.type = v; route(); break; }
      case 'tab': {
        if (v === 'photo') { openScan(); break; }
        closeOpen(); S.tab = v; renderMain();
        const sc = $('#V-' + v + ' .scroll'); if (sc) sc.scrollTop = 0;
        if (v !== 'home') hintSeen();
        syncProto(); break;
      }
      case 'hint': hintSeen(); renderHome(); break;
      case 'settings': closeOpen(); renderSettings(); show('main', 'settings'); break;
      case 'close-settings': show('main'); break;
      case 'rayon': S.srayon = v; renderStock(); break;
      case 'open-p': openProduct(b.dataset.id); break;
      case 'end-promo': endPromo(b.dataset.id); break;
      case 'do': phoneAct(b.dataset.id, b.dataset.k); break;
      case 'do-p': phoneAct(b.dataset.id || S.productId, b.dataset.k, true); break;
      case 'close-product': renderMain(); show(...($('#L-settings').classList.contains('on') ? ['main', 'settings'] : ['main'])); break;
      case 'pqty': { const p = find(S.productId); p.qty = Math.max(1, p.qty + +v); renderProduct(); break; }
      case 'details': { const p = find(S.productId); openSheet(`<div class="grab"></div><h2>Détails</h2><div class="box">${detailsKv(p)}</div><button class="btn btn-ghost btn-block" data-act="sheet-close">Fermer</button>`); break; }
      case 'scan': openScan(); break;
      case 'scan-close': closeScan(); break;
      case 'rafale': SC.rafale = !SC.rafale; b.classList.toggle('on', SC.rafale); b.setAttribute('aria-pressed', SC.rafale); if (SC.state === 'found') renderScanSheet(); break;
      case 'manual': manualEntry(); break;
      case 's-day': SC.d = +v; renderScanSheet(); break;
      case 's-dt': SC.dt = v; renderScanSheet(); break;
      case 'set-dt': { const p = find(curView === 'phone' ? S.productId : S.panelId); if (p) { p.dt = v; refresh(); } break; }
      case 's-editdate': SC.editDate = true; renderScanSheet(); break;
      case 's-qty': SC.qty = Math.max(1, SC.qty + +v); $('#s-qty').textContent = SC.qty; break;
      case 's-ok': scanValidate(); break;
      case 'bilan-detail': bilanDetailSheet(); break;
      case 'mode': S.mode = v; refresh(); toast(v === 'promo' ? 'Mode promo activé' : v === 'rotation' ? 'Mode rotation activé' : 'Promo et rotation activées'); break;
      case 'notif-enable': enableNotif(); break;
      case 'notif-test': testNotif(); break;
      case 'notif-off': disableNotif(); break;
      case 'alert': {
        const [h, m] = S.alert.split(':').map(Number);
        const t = (h * 60 + m + +v + 1440) % 1440;
        S.alert = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
        store.set('frescy.alert', S.alert);
        if (pushSub) schedulePushSync();
        refresh(); break;
      }
      case 'manage': curView === 'phone' ? openSheet(manageHtml('main', 'phone')) : openModal(manageHtml('main', 'desk')); break;
      case 'manage-cancel': curView === 'phone' ? openSheet(manageHtml('cancel', 'phone')) : openModal(manageHtml('cancel', 'desk')); break;
      case 'cancel-sub': closeSheet(); closeModal(); S.sub = 'inactive'; S.panelId = null; route(); break;
      case 'sheet-close': closeSheet(); break;
      case 'reactivate': {
        b.disabled = true; b.textContent = 'Réactivation…';
        setTimeout(() => { S.sub = 'active'; S.tab = 'home'; S.dpage = 'todo'; route(); toast('Abonnement réactivé. Bon retour !'); }, 700);
        break;
      }
      case 'logout': closeSheet(); closeModal(); S.logged = false; S.auth = 'login'; S.panelId = null; route(); break;
      case 'undo': if (lastUndo) { lastUndo(); lastUndo = null; } $$('#toast, #dtoast').forEach(t => t.classList.remove('on')); break;
      // Ordinateur
      case 'dnav': { S.dpage = v; S.panelId = null; S.adding = false; deskRender(); const dm = $('.dmain', desk); if (dm) dm.scrollTop = 0; break; }
      case 'ddo': deskAct(b.dataset.id, b.dataset.k); break;
      case 'dclose': S.panelId = null; deskRender(); break;
      case 'dpqty': { const p = find(S.panelId); p.qty = Math.max(1, p.qty + +v); deskRender(); break; }
      case 'dsort': S.dsort = S.dsort === 'asc' ? 'desc' : 'asc'; deskRender(); break;
      case 'dadd': S.adding = true; S.added = 0; S.addDraft = { name: '', date: '', qty: '1' }; deskRender(); $('#a-name').focus(); break;
      case 'dexport': exportModal(); break;
      case 'dpdf': closeModal(); deskToast('Maquette : le PDF serait téléchargé ici'); break;
      case 'dmodal-close': closeModal(); break;
    }
  });
  $('#backdrop').addEventListener('click', closeSheet);
  document.addEventListener('mousedown', e => { if (e.target.id === 'dmodal-back') closeModal(); });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 's-name') SC.name = t.value;
    if (t.id === 'm-q') { S.sq = t.value; $('#stock-list').innerHTML = stockList(); }
    if (t.id === 'd-q') { S.dq = t.value; $('#d-tbody').innerHTML = prodRows(); $('#d-count').textContent = countText(); }
    if (t.id === 'a-name') S.addDraft.name = t.value;
    if (t.id === 'a-qty') S.addDraft.qty = t.value;
    if (t.id === 'a-date') { S.addDraft.date = t.value; $('#a-prev').innerHTML = addPreview(); }
  });
  document.addEventListener('submit', e => {
    const f = e.target;
    e.preventDefault();
    if (f.id === 'd-add') { deskAdd(); return; }
    const kind = f.dataset.form;
    if (!kind) return;
    readAuthForm(f);
    if (kind === 'step1') { S.step = 2; route(); const n = $('[id$="-shop"]'); if (n) n.focus(); return; }
    if (kind === 'step2') {
      if (S.draft.shop) S.shop.name = S.draft.shop;
      if (S.draft.email) S.shop.email = S.draft.email;
      S.shop.type = S.draft.type;
    }
    S.logged = true; S.tab = 'home'; S.dpage = 'todo'; route();
    if (curView === 'phone') nudgeFirstRow();
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'p-date' && t.value) { find(S.productId).d = offsetFromIso(t.value); renderProduct(); renderMain(); }
    if (t.id === 's-cal' && t.value) { SC.d = Math.max(0, offsetFromIso(t.value)); renderScanSheet(); }
    if (t.id === 'dp-date' && t.value) { find(S.panelId).d = offsetFromIso(t.value); deskRender(); }
    if (t.id === 'd-cat') { S.dcat = t.value; $('#d-tbody').innerHTML = prodRows(); $('#d-count').textContent = countText(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (curView === 'phone') {
      if ($('#sheet').classList.contains('on')) closeSheet();
      else if ($('#L-product').classList.contains('on')) { renderMain(); show('main'); }
      else if ($('#L-scan').classList.contains('on')) closeScan();
      else if ($('#L-settings').classList.contains('on')) show('main');
      return;
    }
    const mb = $('#dmodal-back');
    if (mb && mb.classList.contains('on')) closeModal();
    else if (S.adding) { S.adding = false; deskRender(); }
    else if (S.panelId) { S.panelId = null; deskRender(); }
  });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (effView() !== curView) applyView(); }, 120); });

  function protoGo(k) {
    closeSheet(); closeModal(); clearTimeout(SC.timer);
    if (k === 'reset') { const v = S.view; S = fresh(); S.view = v; SC.idx = 0; store.del('frescy.hintSeen'); route(); return; }
    if (k === 'login') { S.logged = false; S.auth = 'signup'; S.step = 1; route(); return; }
    S.logged = true;
    if (k === 'inactive') { S.sub = 'inactive'; route(); return; }
    S.sub = 'active';
    if (TABS.includes(k)) { S.tab = k; route(); return; }
    S.tab = 'home'; route();
    if (k === 'settings') { renderSettings(); show('main', 'settings'); }
    if (k === 'scan') openScan();
    if (k === 'product') openProduct((active().find(p => p.d === 1) || active()[0]).id);
  }

  registerSW();
  applyView();
})();
</script>
</body>
</html>
